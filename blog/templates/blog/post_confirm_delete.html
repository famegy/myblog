{% extends 'blog/base.html' %}

{% block title %}Delete Post{% endblock %}

{% block content %}
  <h2>Delete "{{post.title}}"?</h2>
  <p>This action cannot be undone.!</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete it</button>
    <a href="{% url 'post_detail' post.slug %}">Cancel</a>
  </form>
{% endblock %}
