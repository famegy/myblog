{% extends 'blog/base.html' %} {% block title %}{{post.title}}{% endblock %}
{%block content %}
<article>
  {% if user == post.author %}
    <p class="edit"> 
      <a href="{% url 'post_edit' post.slug %}">Edit this post<a/>
    
      <a href="{% url 'post_delete' post.slug %}">Delete this post</a>
    </p>
  {% endif %}


  <h2>{{ post.title }}</h2>
  <p>By {{post.author}} on {{post.published_at|date:"F j, Y"}}</p>
  <p>{{ post.content|linebreaks }}</p>
  
</article>
{% endblock %}
