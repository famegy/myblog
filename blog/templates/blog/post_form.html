{% extends "blog/base.html" %}

{% block title %}
  {% if editing %}Edit Post{% else %}Write a Post{% endif %}
{% endblock %}

{% block content %}

<h2>Write a new Post</h2>

<form method='post'>
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">{% if editing %}Save Changes{% else %}Publish{% endif %}</button>
</form>


{% endblock %}
